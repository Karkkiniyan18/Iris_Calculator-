<!DOCTYPE html>
<title>Iris Calculator</title>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A premium digital calculator with a stunning glassmorphism design, featuring frosted glass effects, animated backgrounds, and smooth interactions." />
  <title>Iris Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ─────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0a0a0a;
    }

    /* ── Animated Gradient Background ─────────────────── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(135deg,
        #0d0d0d 0%, #1a1a1a 30%, #111111 50%,
        #0d0d0d 70%, #141414 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── Floating Orbs ────────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .25;
      z-index: 1;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width: 340px; height: 340px; background: #333333; top: -60px;  left: -80px;  animation-delay: 0s; }
    .orb-2 { width: 280px; height: 280px; background: #444444; bottom: -40px; right: -60px; animation-delay: -3s; }
    .orb-3 { width: 220px; height: 220px; background: #3a3a3a; top: 50%;  left: 60%;  animation-delay: -6s; }
    .orb-4 { width: 180px; height: 180px; background: #2a2a2a; bottom: 30%; left: 10%;  animation-delay: -4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-40px) scale(1.08); }
    }

    /* ── Calculator Container ─────────────────────────── */
    .calculator {
      position: relative;
      z-index: 10;
      width: 370px;
      border-radius: 28px;
      padding: 28px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(30px) saturate(1.8);
      -webkit-backdrop-filter: blur(30px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 8px 40px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 0 1px rgba(255, 255, 255, 0.03);
      animation: fadeInUp .8s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Title Bar ─────────────────────────────────────── */
    .title-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .title-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }
    .title-dot.red    { background: #666666; }
    .title-dot.yellow { background: #999999; }
    .title-dot.green  { background: #cccccc; }
    .title-label {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
    }

    /* ── Display ───────────────────────────────────────── */
    .display {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 22px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      border: 1px solid rgba(255,255,255,.06);
      overflow: hidden;
      position: relative;
    }
    .display::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.04), transparent 60%);
      pointer-events: none;
    }

    .expression {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.4);
      min-height: 22px;
      word-break: break-all;
      text-align: right;
      transition: color .2s;
    }

    .result {
      font-size: 42px;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: -1px;
      margin-top: 6px;
      word-break: break-all;
      text-align: right;
      transition: all .25s cubic-bezier(.16,1,.3,1);
      line-height: 1.1;
    }
    .result.shrink { font-size: 28px; }

    /* ── Button Grid ───────────────────────────────────── */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      position: relative;
      height: 62px;
      border: none;
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all .18s cubic-bezier(.16,1,.3,1);
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,.1), transparent 50%);
      opacity: 0;
      transition: opacity .18s;
    }
    .btn:hover::before { opacity: 1; }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,.3);
    }

    .btn:active {
      transform: translateY(0) scale(.96);
      background: rgba(255, 255, 255, 0.15);
      transition-duration: .06s;
    }

    /* ── Ripple ──────────────────────────────────────── */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0);
      animation: rippleEffect .5s ease-out forwards;
      pointer-events: none;
    }
    @keyframes rippleEffect {
      to { transform: scale(3); opacity: 0; }
    }

    /* ── Operator Buttons ─────────────────────────────── */
    .btn.operator {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.12);
      color: #cccccc;
    }
    .btn.operator:hover {
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .3);
    }

    /* ── Function Buttons ─────────────────────────────── */
    .btn.function {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.1);
      color: #aaaaaa;
      font-size: 16px;
    }
    .btn.function:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .2);
    }

    /* ── Equals Button ────────────────────────────────── */
    .btn.equals {
      grid-column: span 1;
      background: linear-gradient(135deg, #e0e0e0, #ffffff);
      border-color: rgba(255, 255, 255, 0.4);
      color: #111111;
      font-weight: 600;
      font-size: 24px;
    }
    .btn.equals:hover {
      background: linear-gradient(135deg, #f0f0f0, #ffffff);
      box-shadow: 0 6px 28px rgba(255, 255, 255, .15);
      transform: translateY(-2px);
    }
    .btn.equals:active {
      transform: translateY(0) scale(.96);
    }

    /* ── Zero (wide) ──────────────────────────────────── */
    .btn.zero {
      grid-column: span 2;
    }

    /* ── Glow accents ─────────────────────────────────── */
    .calculator::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: 29px;
      background: linear-gradient(135deg,
        rgba(255,255,255,.08), transparent 40%,
        transparent 60%, rgba(255,255,255,.04));
      z-index: -1;
      opacity: .5;
      transition: opacity .3s;
    }
    .calculator:hover::before { opacity: .8; }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 420px) {
      .calculator { width: 92vw; padding: 20px; }
      .btn { height: 56px; font-size: 18px; border-radius: 14px; }
      .result { font-size: 34px; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>

  <!-- Calculator -->
  <div class="calculator" id="calculator">
    <!-- Title Bar -->
    <div class="title-bar">
      <span class="title-dot red"></span>
      <span class="title-dot yellow"></span>
      <span class="title-dot green"></span>
      <span class="title-label">Calculator</span>
    </div>

    <!-- Display -->
    <div class="display" id="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <button class="btn function" id="btn-clear"   data-action="clear">AC</button>
      <button class="btn function" id="btn-sign"     data-action="sign">+/−</button>
      <button class="btn function" id="btn-percent"  data-action="percent">%</button>
      <button class="btn operator" id="btn-divide"   data-action="operator" data-value="÷">÷</button>

      <button class="btn" id="btn-7" data-action="number" data-value="7">7</button>
      <button class="btn" id="btn-8" data-action="number" data-value="8">8</button>
      <button class="btn" id="btn-9" data-action="number" data-value="9">9</button>
      <button class="btn operator" id="btn-multiply" data-action="operator" data-value="×">×</button>

      <button class="btn" id="btn-4" data-action="number" data-value="4">4</button>
      <button class="btn" id="btn-5" data-action="number" data-value="5">5</button>
      <button class="btn" id="btn-6" data-action="number" data-value="6">6</button>
      <button class="btn operator" id="btn-subtract" data-action="operator" data-value="−">−</button>

      <button class="btn" id="btn-1" data-action="number" data-value="1">1</button>
      <button class="btn" id="btn-2" data-action="number" data-value="2">2</button>
      <button class="btn" id="btn-3" data-action="number" data-value="3">3</button>
      <button class="btn operator" id="btn-add"      data-action="operator" data-value="+">+</button>

      <button class="btn zero" id="btn-0" data-action="number" data-value="0">0</button>
      <button class="btn" id="btn-decimal" data-action="decimal" data-value=".">.</button>
      <button class="btn equals" id="btn-equals" data-action="equals">=</button>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────
    let currentInput  = '0';
    let previousInput = '';
    let operator      = '';
    let shouldReset   = false;

    const expressionEl = document.getElementById('expression');
    const resultEl     = document.getElementById('result');

    // ── Helpers ────────────────────────────────────────
    function formatNumber(num) {
      if (num === 'Error') return 'Error';
      const n = parseFloat(num);
      if (isNaN(n)) return '0';
      if (Number.isInteger(n) && Math.abs(n) < 1e15) return n.toLocaleString('en-US');
      if (Math.abs(n) >= 1e15) return n.toExponential(4);
      // Keep decimal precision during input
      if (num.toString().includes('.')) {
        const parts = num.toString().split('.');
        const intPart = parseInt(parts[0]).toLocaleString('en-US');
        return parts[1] !== undefined ? intPart + '.' + parts[1] : intPart + '.';
      }
      return n.toLocaleString('en-US', { maximumFractionDigits: 10 });
    }

    function updateDisplay() {
      resultEl.textContent = formatNumber(currentInput);
      resultEl.classList.toggle('shrink', currentInput.length > 10);
    }

    function calculate(a, op, b) {
      const x = parseFloat(a);
      const y = parseFloat(b);
      switch (op) {
        case '+': return x + y;
        case '−': return x - y;
        case '×': return x * y;
        case '÷': return y === 0 ? 'Error' : x / y;
        default:  return y;
      }
    }

    // ── Ripple Effect ──────────────────────────────────
    function createRipple(e, btn) {
      const circle = document.createElement('span');
      const rect   = btn.getBoundingClientRect();
      const size   = Math.max(rect.width, rect.height);
      circle.style.width = circle.style.height = size + 'px';
      circle.style.left  = (e.clientX - rect.left - size / 2) + 'px';
      circle.style.top   = (e.clientY - rect.top  - size / 2) + 'px';
      circle.classList.add('ripple');
      btn.appendChild(circle);
      circle.addEventListener('animationend', () => circle.remove());
    }

    // ── Event Delegation ───────────────────────────────
    document.querySelector('.buttons').addEventListener('click', (e) => {
      const btn = e.target.closest('.btn');
      if (!btn) return;

      createRipple(e, btn);

      const action = btn.dataset.action;
      const value  = btn.dataset.value;

      switch (action) {
        case 'number':
          if (currentInput === '0' || shouldReset) {
            currentInput = value;
            shouldReset  = false;
          } else if (currentInput.replace(/[^0-9]/g, '').length < 15) {
            currentInput += value;
          }
          updateDisplay();
          break;

        case 'decimal':
          if (shouldReset) {
            currentInput = '0.';
            shouldReset  = false;
          } else if (!currentInput.includes('.')) {
            currentInput += '.';
          }
          updateDisplay();
          break;

        case 'operator':
          if (operator && !shouldReset) {
            const result = calculate(previousInput, operator, currentInput);
            currentInput = result === 'Error' ? 'Error' : String(result);
            updateDisplay();
          }
          expressionEl.textContent = formatNumber(currentInput) + ' ' + value;
          previousInput = currentInput;
          operator      = value;
          shouldReset   = true;
          break;

        case 'equals':
          if (!operator) break;
          expressionEl.textContent = formatNumber(previousInput) + ' ' + operator + ' ' + formatNumber(currentInput) + ' =';
          const res = calculate(previousInput, operator, currentInput);
          currentInput  = res === 'Error' ? 'Error' : String(res);
          operator      = '';
          previousInput = '';
          shouldReset   = true;
          updateDisplay();
          // Animate result pop
          resultEl.style.transform = 'scale(1.06)';
          setTimeout(() => resultEl.style.transform = '', 180);
          break;

        case 'clear':
          currentInput  = '0';
          previousInput = '';
          operator      = '';
          shouldReset   = false;
          expressionEl.textContent = '';
          updateDisplay();
          break;

        case 'sign':
          if (currentInput !== '0' && currentInput !== 'Error') {
            currentInput = currentInput.startsWith('-')
              ? currentInput.slice(1)
              : '-' + currentInput;
            updateDisplay();
          }
          break;

        case 'percent':
          if (currentInput !== 'Error') {
            currentInput = String(parseFloat(currentInput) / 100);
            updateDisplay();
          }
          break;
      }
    });

    // ── Keyboard Support ───────────────────────────────
    document.addEventListener('keydown', (e) => {
      const keyMap = {
        '0':'btn-0','1':'btn-1','2':'btn-2','3':'btn-3','4':'btn-4',
        '5':'btn-5','6':'btn-6','7':'btn-7','8':'btn-8','9':'btn-9',
        '.':'btn-decimal','+':'btn-add','-':'btn-subtract',
        '*':'btn-multiply','x':'btn-multiply','X':'btn-multiply',
        '/':'btn-divide','%':'btn-percent',
        'Enter':'btn-equals','=':'btn-equals',
        'Backspace':'btn-clear','Delete':'btn-clear','Escape':'btn-clear',
      };
      const id = keyMap[e.key];
      if (id) {
        e.preventDefault();
        const btn = document.getElementById(id);
        if (btn) {
          btn.click();
          btn.style.transform = 'scale(.94)';
          setTimeout(() => btn.style.transform = '', 120);
        }
      }
    });
  </script>
</body>
</html>
